[package]
name = "redis-task-graph"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "A Redis-backed async task queue with typed task chains, leases, retries and adaptive concurrency"
license = "MIT"
repository = "https://github.com/evandowling/redis-task-graph"
readme = "README.md"
keywords = ["redis", "queue", "tasks", "async", "jobs"]
categories = ["asynchronous", "concurrency"]
authors = ["Evan Dowling"]
# Benchmark results and the local monitoring setup aren't needed to build or use the crate.
exclude = ["/perf/", "/monitoring/", "/.github/"]

[dependencies]
futures = "0.3.34"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"], optional = true }
rand = "0.10.3"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "streams", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", features = ["metrics", "rt-tokio", "testing"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
tokio = { version = "1.54.1", features = ["signal", "rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bench]]
name = "load"
path = "benches/load/main.rs"
harness = false

[features]
otel = ["dep:opentelemetry"]

[[example]]
name = "monitored"
required-features = ["otel"]

[package.metadata.docs.rs]
all-features = true
