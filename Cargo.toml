[package]
name = "redis-task-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
rand = "0.10.3"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "streams", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tracing-subscriber = "0.3.23"
